<style>
:root{--violet:oklch(44% .19 294);--deep:oklch(25% .06 295);--lilac:oklch(83% .12 295);--lavender:oklch(96% .025 295);--paper:oklch(99% .012 80);--ink:oklch(25% .045 300);--muted:oklch(46% .045 295);--pink:oklch(70% .18 8);--gold:oklch(86% .18 88);--line:oklch(88% .04 295);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--lavender);color:var(--ink);font:16px/1.5 Quicksand,system-ui,sans-serif}body.locked{overflow:hidden}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:4px}h1,h2,p{margin:0}h1,h2{font-family:Fredoka,sans-serif;text-wrap:balance}.hero{min-height:100svh;position:relative;isolation:isolate;display:grid;place-items:center;overflow:hidden;background:linear-gradient(125deg,var(--violet),var(--lilac),var(--pink),var(--violet));background-size:400% 400%;animation:shift 15s var(--ease) infinite}.hero-video{position:absolute;inset:0;width:100%;height:100%;z-index:-3;object-fit:cover;opacity:.48;mix-blend-mode:multiply}.wash{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,oklch(20% .08 295 / .08),oklch(18% .06 295 / .6))}.hero-copy{width:min(100% - 32px,900px);text-align:center;color:var(--paper)}.eyebrow,.kicker{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.eyebrow{display:inline-flex;gap:10px;align-items:center;margin-bottom:18px}.eyebrow:before,.eyebrow:after{content:'';width:30px;height:1px;background:currentColor;opacity:.65}.hero h1{font-size:clamp(3.2rem,11vw,8.5rem);line-height:.9;letter-spacing:-.05em;text-shadow:0 10px 28px oklch(18% .07 295 / .3)}.hero p{max-width:38ch;margin:28px auto 0;font-weight:600;color:oklch(98% .01 80 / .9)}.scroll{display:inline-block;margin-top:40px;padding:12px 18px;border:1px solid oklch(99% .01 80 / .4);border-radius:999px;color:var(--paper);text-decoration:none;background:oklch(18% .07 295 / .15);transition:transform .25s var(--ease)}.scroll:hover{transform:translateY(-3px)}.balloon{position:absolute;bottom:-100px;left:var(--x);width:52px;height:68px;border-radius:52%;background:var(--c);opacity:.72;pointer-events:none;animation:float var(--d) linear infinite;animation-delay:var(--delay);box-shadow:inset -8px -10px 0 oklch(20% .05 295 / .1)}.balloon:after{content:'';position:absolute;top:100%;left:50%;height:110px;width:1px;background:oklch(99% .01 80 / .5)}.section{width:min(100% - 32px,1160px);margin:auto;padding:96px 0}.heading{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:end;margin-bottom:38px}.kicker{color:var(--violet);margin-bottom:12px}.heading h2,.cake h2{font-size:clamp(2.5rem,6vw,5rem);line-height:.98;letter-spacing:-.04em}.lead{max-width:32ch;justify-self:end;color:var(--muted);font-weight:600}.featured{margin-bottom:90px}.featured-frame{position:relative;overflow:hidden;border-radius:28px;background:var(--deep);box-shadow:0 22px 60px oklch(30% .08 295 / .15)}.featured-frame video{display:block;width:100%;max-height:70svh;aspect-ratio:16/9;object-fit:contain;background:oklch(18% .05 295)}.featured-label{position:absolute;left:18px;bottom:18px;padding:8px 12px;border-radius:999px;background:oklch(18% .06 295 / .72);color:var(--paper);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.gallery{columns:3 270px;column-gap:16px}.tile{display:block;width:100%;margin:0 0 16px;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 8px 30px oklch(30% .06 295 / .1);cursor:zoom-in;break-inside:avoid;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}.tile:hover{transform:translateY(-5px) rotate(.2deg);box-shadow:0 22px 60px oklch(30% .08 295 / .15)}.tile img{display:block;width:100%;height:auto;object-fit:contain;background:var(--lilac)}.tile span{display:block;padding:9px 12px;color:var(--muted);font-family:Caveat,cursive;font-size:1.25rem;text-align:left}.empty{padding:40px;border:1px dashed var(--lilac);border-radius:22px;text-align:center;color:var(--muted)}.cake{position:relative;padding:110px 16px 120px;overflow:hidden;background:var(--deep);color:var(--paper);text-align:center}.cake .kicker{color:var(--lilac)}.cake p.copy{max-width:48ch;margin:18px auto 0;color:oklch(94% .02 295)}.stage{position:relative;width:min(100%,620px);height:350px;margin:30px auto 0;display:grid;place-items:center}.glow{position:absolute;width:min(80vw,500px);height:260px;border-radius:50%;background:oklch(80% .18 88 / .15);filter:blur(30px);transition:opacity .5s var(--ease)}.cake-art{position:relative;width:min(84vw,420px);height:210px;margin-top:75px}.top{position:absolute;inset:18px 5% auto;height:70px;border-radius:50%;background:oklch(79% .13 28);border:8px solid oklch(64% .12 20)}.body{position:absolute;left:5%;top:50px;width:90%;height:115px;border-radius:16px 16px 30px 30px;background:repeating-linear-gradient(90deg,oklch(74% .13 25) 0 26px,oklch(80% .14 31) 26px 52px);border-bottom:14px solid oklch(60% .13 22)}.plate{position:absolute;bottom:0;left:0;width:100%;height:32px;border-radius:50%;background:oklch(84% .07 295)}.candles{position:absolute;z-index:3;left:14%;right:14%;top:-35px;display:flex;justify-content:space-between}.candle{position:relative;width:24px;height:74px;border:0;border-radius:9px 9px 4px 4px;background:repeating-linear-gradient(120deg,oklch(92% .05 295) 0 8px,var(--pink) 8px 13px);cursor:pointer;transition:opacity .3s var(--ease),transform .3s var(--ease)}.candle.out{opacity:.5;transform:translateY(7px)}.flame{position:absolute;left:50%;top:-28px;width:18px;height:27px;transform:translateX(-50%) rotate(45deg);border-radius:70% 0 70% 70%;background:var(--gold);box-shadow:0 0 24px 8px oklch(86% .18 88 / .35);animation:flicker .8s ease-in-out infinite alternate}.candle.out .flame{opacity:0;animation:none;transform:translateX(-50%) rotate(45deg) scale(.2)}.smoke{position:absolute;left:50%;top:-20px;width:11px;height:22px;border:2px solid oklch(92% .02 295 / .7);border-bottom:0;border-radius:50%;opacity:0}.candle.out .smoke{animation:smoke .8s var(--ease) forwards}.dim{position:absolute;inset:-20px;z-index:4;border-radius:28px;background:oklch(10% .04 295 / var(--opacity,0));pointer-events:none;transition:opacity .5s var(--ease)}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.primary,.secondary{min-height:48px;padding:12px 18px;border-radius:999px;cursor:pointer;font-weight:700;transition:transform .25s var(--ease)}.primary{border:0;background:var(--gold);color:var(--deep)}.primary:disabled{opacity:.6;cursor:default}.secondary{border:1px solid oklch(99% .01 80 / .4);background:transparent;color:var(--paper)}.primary:hover,.secondary:hover{transform:translateY(-3px)}.status{min-height:26px;margin-top:16px!important;color:var(--lilac)!important;font-size:.9rem}.meter-wrap{width:min(100%,260px);margin:14px auto 0;text-align:left}.meter-wrap label{display:flex;justify-content:space-between;color:oklch(88% .03 295);font-size:.75rem;font-weight:700}.meter{height:8px;margin-top:5px;overflow:hidden;border-radius:99px;background:oklch(99% .01 80 / .15)}.meter i{display:block;width:0;height:100%;border-radius:inherit;background:var(--gold);transition:width .08s linear}.wish{display:none;width:min(100%,600px);margin:30px auto 0;padding:28px;border-radius:22px;background:var(--paper);color:var(--ink);animation:reveal .6s var(--ease) both}.wish.show{display:block}.wish p{font:clamp(1.7rem,4vw,2.4rem)/1.1 Caveat,cursive}.wish small{display:block;margin-top:14px;color:var(--violet);font-weight:700}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}footer{padding:28px 20px 42px;background:var(--deep);color:oklch(84% .04 295);text-align:center;font-size:.86rem}.lightbox{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:oklch(12% .04 295 / .95);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}.lightbox.open{opacity:1;pointer-events:auto}.lightbox img{max-width:92vw;max-height:82vh;object-fit:contain}.close,.arrow{position:fixed;width:48px;height:48px;border:1px solid oklch(99% .01 80 / .35);border-radius:50%;background:oklch(20% .06 295 / .55);color:var(--paper);cursor:pointer}.close{top:20px;right:20px;font-size:1.5rem}.arrow{top:50%;transform:translateY(-50%);font-size:1.4rem}.prev{left:20px}.next{right:20px}.caption{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:var(--paper);font:1.3rem Caveat,cursive;white-space:nowrap}
@keyframes shift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}@keyframes float{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-125vh) rotate(12deg)}}@keyframes flicker{from{transform:translateX(-50%) rotate(42deg) scale(.95)}to{transform:translateX(-50%) rotate(48deg) scale(1.08)}}@keyframes smoke{from{opacity:.8;transform:translate(-50%,10px) scale(.7)}to{opacity:0;transform:translate(-30%,-45px) scale(1.5) rotate(30deg)}}@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.heading{grid-template-columns:1fr;gap:18px}.lead{justify-self:start}.gallery{columns:2 190px;column-gap:12px}.tile{margin-bottom:12px}.arrow{top:auto;bottom:18px;transform:none}.prev{left:calc(50% - 60px)}.next{right:calc(50% - 60px)}}@media(max-width:480px){.section{padding:72px 0}.featured{margin-bottom:68px}.gallery{columns:1}.tile{margin-bottom:14px}.featured-frame video{aspect-ratio:4/3}.caption{bottom:78px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}
</style>

<body>
<header class="hero"><video class="hero-video" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="./hero.mp4" type="video/mp4"></video><div class="wash"></div><div id="balloons"></div><div class="hero-copy"><div class="eyebrow">a little memory lane</div><h1 id="title"></h1><p id="subtitle"></p><a class="scroll" href="#memories">scroll for memories ↓</a></div></header>
<main><section class="section" id="memories"><div class="featured"><div class="featured-frame"><video class="memory-video" autoplay muted loop playsinline preload="auto"><source src="./hero.mp4" type="video/mp4"></video></div></div><div class="gallery" id="gallery"></div></section>
<section class="cake" id="cake"><canvas id="confetti"></canvas><div class="kicker">your turn</div><h2>Make a wish, Nidhi.</h2><p class="copy">Blow into your microphone to put out each candle, one at a time. No mic? Tap the candles instead.</p><div class="stage"><div class="glow" id="glow"></div><div class="cake-art"><div class="top"></div><div class="body"></div><div class="candles" id="candles"></div><div class="plate"></div><div class="dim" id="dim"></div></div></div><div class="controls"><button class="primary" id="mic" type="button">🎤 Blow the candles</button><button class="secondary" id="reset" type="button" hidden>Relight candles 🔥</button></div><div class="meter-wrap" id="meterWrap" hidden><label><span>microphone level</span><span id="meterText">calibrating</span></label><div class="meter"><i id="meterFill"></i></div></div><p class="status" id="status" role="status"></p><div class="wish" id="wish"><p id="wishText"></p><small id="signature"></small></div></section></main><footer id="footer"></footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true"><button class="close" id="close" aria-label="Close photo viewer">×</button><button class="arrow prev" id="prev" aria-label="Previous photo">‹</button><img id="large" alt=""><button class="arrow next" id="next" aria-label="Next photo">›</button><div class="caption" id="caption"></div></div>
<script>
// ---------- Editable content ----------
const CONFIG={
  name:'Nidhi Gujjar',
  fromName:'Your bro (MiT)',
  heroSubtitle:"Here's a little trip down memory lane, just for you 🎈",
  wish:'May this year bring you the kind of happiness you keep giving everyone else. Happy birthday, Nidhi!',
  candleCount:6,
  blowCooldownMs:700    // ms cooldown after one candle goes out before the next blow can count (600-800ms)
};

// 16 horizontal (landscape) photos first, then 8 vertical (portrait) photos — do not interleave.
const PHOTOS=[
  ...Array.from({length:16},(_,i)=>({src:`./h${i+1}.jpg`,caption:`Memory ${i+1}`})),
  ...Array.from({length:8},(_,i)=>({src:`./v${i+1}.jpg`,caption:`Little moment ${i+1}`}))
];

const $=s=>document.querySelector(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let photos=[...PHOTOS],current=0,lastTile=null,nextCandle=0,touchStartX=0;

$('#title').textContent=`Happy Birthday, ${CONFIG.name}!!`;
$('#subtitle').textContent=CONFIG.heroSubtitle;
$('#wishText').textContent=CONFIG.wish;
$('#signature').textContent=`With love, ${CONFIG.fromName}`;
$('#footer').textContent=`Made with 💛 by ${CONFIG.fromName}`;
$('#balloons').innerHTML=Array.from({length:11},(_,i)=>`<span class="balloon" style="--x:${5+i*9}%;--c:${['var(--lilac)','var(--pink)','var(--gold)','var(--violet)'][i%4]};--d:${13+i%4*2}s;--delay:-${i*1.3}s"></span>`).join('');

// ---------- Gallery ----------
function renderGallery(){
  if(!photos.length){$('#gallery').innerHTML='<p class="empty">Add h1.jpg to h16.jpg and v1.jpg to v8.jpg beside index.html.</p>';return}
  $('#gallery').innerHTML=photos.map((p,i)=>`<button class="tile" data-i="${i}" type="button" aria-label="Open ${p.caption}"><img src="${p.src}" alt="${p.caption}, a birthday memory" loading="lazy"><span>${p.caption}</span></button>`).join('')
}
renderGallery();

function show(i){current=(i+photos.length)%photos.length;const p=photos[current];$('#large').src=p.src;$('#large').alt=p.caption;$('#caption').textContent=p.caption}
function openBox(i,t){lastTile=t;show(i);$('#lightbox').classList.add('open');$('#lightbox').setAttribute('aria-hidden','false');document.body.classList.add('locked');$('#close').focus()}
function closeBox(){$('#lightbox').classList.remove('open');$('#lightbox').setAttribute('aria-hidden','true');document.body.classList.remove('locked');lastTile?.focus()}
$('#gallery').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openBox(+t.dataset.i,t)});
$('#close').onclick=closeBox;
$('#prev').onclick=()=>show(current-1);
$('#next').onclick=()=>show(current+1);
$('#lightbox').onclick=e=>{if(e.target===$('#lightbox'))closeBox()};
$('#lightbox').addEventListener('touchstart',e=>touchStartX=e.changedTouches[0].clientX,{passive:true});
$('#lightbox').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>45)show(current+(dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#lightbox').classList.contains('open'))closeBox();
  if($('#lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft')show(current-1);
    if(e.key==='ArrowRight')show(current+1);
    if(e.key==='Tab'){
      const f=[...$('#lightbox').querySelectorAll('button')],first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  }
});

// ---------- Cake / candles ----------
function makeCandles(){
  let h='';
  for(let i=0;i<CONFIG.candleCount;i++)h+=`<button class="candle" data-c="${i}" type="button" aria-label="Candle ${i+1}, lit"><i class="flame"></i><i class="smoke"></i></button>`;
  $('#candles').innerHTML=h;
  updateLight();
}
function updateLight(){
  $('#dim').style.setProperty('--opacity',(nextCandle/CONFIG.candleCount*.7).toFixed(2));
  $('#glow').style.opacity=1-nextCandle/CONFIG.candleCount*.76;
}
function extinguish(){
  if(nextCandle>=CONFIG.candleCount)return;
  const c=document.querySelector(`[data-c="${nextCandle}"]`);
  if(!c)return;
  c.classList.add('out');
  c.setAttribute('aria-label',`Candle ${nextCandle+1}, blown out`);
  nextCandle++;
  updateLight();
  $('#status').textContent=nextCandle===CONFIG.candleCount?'Wish locked in. Happy birthday! 🎉':`${CONFIG.candleCount-nextCandle} candle${CONFIG.candleCount-nextCandle===1?'':'s'} left. Keep blowing!`;
  if(nextCandle===CONFIG.candleCount){
    $('#wish').classList.add('show');
    $('#mic').hidden=true;
    $('#reset').hidden=false;
    stopMic();
    confetti();
  }
}
$('#candles').addEventListener('click',e=>{if(e.target.closest('.candle')&&nextCandle<CONFIG.candleCount)extinguish()});

// ---------- Microphone blow detection (Web Audio API) ----------
// Time-domain RMS amplitude detector, calibrated against room noise,
// requiring a sustained signal (not a single frame/spike) before it
// counts as a blow. One valid blow = exactly one candle, then a cooldown.
let micStream=null,audioCtx=null,analyser=null,rafId=0;
let noiseFloor=0,blowThreshold=0,listening=false;
let aboveSince=0,lastBlowTime=0;

const SUSTAIN_MS=200;        // signal must stay above threshold this long to count as a blow (150-300ms window)
const COOLDOWN_MS=Math.max(600,Math.min(800,CONFIG.blowCooldownMs||700));
const CALIBRATION_MS=1000;

// RMS amplitude from time-domain (waveform) data, 0..1 scale
function rmsAmplitude(byteData){
  let sumSquares=0;
  for(let i=0;i<byteData.length;i++){
    const centered=(byteData[i]-128)/128; // -1..1
    sumSquares+=centered*centered;
  }
  return Math.sqrt(sumSquares/byteData.length);
}

async function startMic(){
  if(listening)return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    fallback("Microphone access isn't available. You can tap the candles instead 💨");
    return;
  }
  $('#mic').disabled=true;
  $('#status').textContent='Requesting microphone access…';
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(err){
    fallback("Microphone access isn't available. You can tap the candles instead 💨");
    return;
  }
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    const source=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=0; // raw samples, we do our own smoothing/sustain logic
    source.connect(analyser);
  }catch(err){
    fallback("Microphone access isn't available. You can tap the candles instead 💨");
    return;
  }

  $('#meterWrap').hidden=false;
  $('#meterText').textContent='calibrating';
  $('#status').textContent='Stay quiet for a moment…';

  const data=new Uint8Array(analyser.fftSize);
  const samples=[];
  const calibStart=performance.now();

  function calibStep(){
    analyser.getByteTimeDomainData(data);
    const amp=rmsAmplitude(data);
    samples.push(amp);
    meter(amp);
    if(performance.now()-calibStart<CALIBRATION_MS){
      rafId=requestAnimationFrame(calibStep);
    }else{
      const base=samples.reduce((a,b)=>a+b,0)/samples.length;
      const peak=Math.max(...samples);
      noiseFloor=base;
      // Adaptive threshold: comfortably above both the average noise floor
      // and the noisiest moment measured, but low enough that an ordinary
      // breath into a phone mic will clear it.
      blowThreshold=Math.max(base*3,peak*1.4,0.05);
      listening=true;
      aboveSince=0;
      lastBlowTime=0;
      $('#mic').disabled=false;
      $('#mic').textContent='🌬️ Blow!';
      $('#status').textContent='🌬️ Blow toward your microphone!';
      $('#meterText').textContent='listening';
      poll(data);
    }
  }
  calibStep();
}

function poll(data){
  if(!listening||!analyser)return;
  analyser.getByteTimeDomainData(data);
  const amp=rmsAmplitude(data);
  meter(amp);
  const now=performance.now();

  if(now-lastBlowTime<COOLDOWN_MS){
    // cooling down after a blow — don't accumulate sustain, don't trigger
    aboveSince=0;
    rafId=requestAnimationFrame(()=>poll(data));
    return;
  }

  if(amp>blowThreshold){
    if(!aboveSince)aboveSince=now;
    if(now-aboveSince>=SUSTAIN_MS){
      // sustained blow confirmed — extinguish exactly one candle
      aboveSince=0;
      lastBlowTime=now;
      extinguish();
    }
  }else{
    aboveSince=0;
  }

  rafId=requestAnimationFrame(()=>poll(data));
}

function meter(amp){
  const pct=Math.min(100,Math.max(0,(amp/0.35)*100));
  $('#meterFill').style.width=`${pct}%`;
  if(listening)$('#meterText').textContent=amp>blowThreshold?'blow! 💨':'listening';
}

function fallback(message){
  stopMic();
  $('#meterWrap').hidden=true;
  $('#mic').disabled=false;
  $('#status').textContent=message;
}

function stopMic(){
  listening=false;
  aboveSince=0;
  if(rafId)cancelAnimationFrame(rafId);
  rafId=0;
  micStream?.getTracks().forEach(t=>t.stop());
  micStream=null;
  analyser=null;
  if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}
  $('#mic').disabled=false;
}

function reset(){
  stopMic();
  nextCandle=0;
  makeCandles();
  $('#wish').classList.remove('show');
  $('#mic').hidden=false;
  $('#reset').hidden=true;
  $('#mic').textContent='🎤 Blow the candles';
  $('#meterWrap').hidden=true;
  $('#status').textContent='';
}
$('#mic').onclick=startMic;
$('#reset').onclick=reset;
makeCandles();

// stop the mic if the person scrolls away from the cake section
const observer=new IntersectionObserver(entries=>{if(entries.some(e=>!e.isIntersecting))stopMic()},{threshold:.05});
observer.observe($('#cake'));

// ---------- Confetti finale ----------
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d'),s=c.parentElement;
  c.width=s.clientWidth*devicePixelRatio;c.height=s.clientHeight*devicePixelRatio;
  x.scale(devicePixelRatio,devicePixelRatio);
  const w=c.width/devicePixelRatio;
  const p=Array.from({length:reduced?30:120},()=>({x:w/2,y:240,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,g:.2+Math.random()*.12,z:4+Math.random()*7,r:Math.random()*6,h:Math.random()*360}));
  let f=0;
  function go(){
    x.clearRect(0,0,w,s.clientHeight);
    p.forEach(q=>{
      q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.r+=.1;
      x.save();x.translate(q.x,q.y);x.rotate(q.r);
      x.fillStyle=`oklch(78% .19 ${q.h})`;
      x.fillRect(-q.z/2,-q.z/2,q.z,q.z*1.8);
      x.restore();
    });
    if(++f<180)requestAnimationFrame(go);
  }
  go();
}

document.addEventListener('DOMContentLoaded',()=>memoryVideo?.play().catch(()=>{}),{once:true});

heroVideo?.play().catch(()=>{});
document.addEventListener('click',()=>heroVideo?.play().catch(()=>{}),{once:true});
window.addEventListener('pagehide',stopMic);
window.addEventListener('beforeunload',stopMic);
</script>
